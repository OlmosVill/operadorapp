include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "lib/generated/**"
    - "build/**"
  errors:
    invalid_annotation_target: ignore  # requerido por freezed
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Desactivadas porque generan demasiado ruido en este proyecto
    public_member_api_docs: false        # no es una librería pública
    one_member_abstracts: false          # usamos clases abstractas para Adapter pattern
    avoid_classes_with_only_static_members: false  # usamos para AppColors, AppStrings
    # Drift DatabaseAccessor usa 'attachedDatabase' como nombre del parámetro padre;
    # super params requeriría renombrarlo, lo que dispara matching_super_parameters.
    use_super_parameters: false

    # Activadas explícitamente
    always_use_package_imports: true
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_constructors_first: true
    use_if_null_to_convert_nulls_to_bools: true
