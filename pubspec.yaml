name: operadorapp
description: Aplicación móvil para operadores de tractocamiones.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + DI
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navegación
  go_router: ^17.2.3

  # Modelos inmutables y serialización
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # HTTP
  dio: ^5.4.3+1

  # Supabase (Auth, DB, Storage, Realtime, Edge Functions)
  supabase_flutter: ^2.5.3

  # Persistencia local offline-first
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0

  # Almacenamiento seguro de tokens
  flutter_secure_storage: ^10.2.0

  # Mapas — implementación A (Google)
  google_maps_flutter: ^2.7.0

  # Mapas — implementación B (OpenStreetMap, default dev)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Animaciones
  rive: ^0.14.6
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # Conectividad (offline-first)
  connectivity_plus: ^7.1.1

  # Programación funcional y manejo de errores tipado
  fpdart: ^1.1.0

  # Logging estructurado
  logger: ^2.3.0

  # Localización (español MX)
  intl: ^0.20.2

  # Imágenes y multimedia
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Variables de entorno
  flutter_dotenv: ^6.0.1

  # Persistencia simple (tema, toggles de notificación)
  shared_preferences: ^2.3.2

  # Utilidades
  equatable: ^2.0.5
  collection: ^1.18.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Generación de código
  build_runner: ^2.4.11
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0+1
  drift_dev: ^2.18.0

  # Testing
  mocktail: ^1.0.4

  # Análisis estático
  very_good_analysis: ^10.2.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/animations/
    - assets/images/

  # Tipografía: se agregarán los archivos en Fase 1 al definir la identidad visual
  # fonts:
  #   - family: Montserrat
  #     fonts:
  #       - asset: assets/fonts/Montserrat-Regular.ttf
  #       - asset: assets/fonts/Montserrat-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Montserrat-Bold.ttf
  #         weight: 700
