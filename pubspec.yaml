name: operadorapp
description: Aplicación móvil para operadores de tractocamiones.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  cached_network_image: ^3.3.1
  collection: ^1.18.0
  connectivity_plus: ^7.1.1
  dio: ^5.4.3+1
  drift: ^2.18.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.0
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^10.2.0
  fpdart: ^1.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  google_maps_flutter: ^2.7.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  latlong2: ^0.9.1
  logger: ^2.3.0
  lottie: ^3.1.2
  path: ^1.9.0
  path_provider: ^2.1.3
  rive: ^0.14.6
  riverpod_annotation: ^4.0.0
  rxdart: ^0.28.0
  shared_preferences: ^2.3.2
  sqlite3_flutter_libs: ^0.5.0
  supabase_flutter: ^2.5.3

dev_dependencies:
  build_runner: ^2.4.11
  custom_lint: ^0.8.1
  drift_dev: ^2.18.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/animations/
    - assets/images/

